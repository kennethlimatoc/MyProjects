<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plant Manager - Update</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='add_plant.css') }}">
</head>
<body>
<div class="container">
    <h1>Update Plant</h1>
    <form action="/update/{{ plant.id }}" method="POST">
        <div class="form-group">
            <label>Plant Name:</label>
            <input type="text" name="plant_name" value="{{ plant.plant_name }}" required>
        </div>

        <div class="form-group">
            <label>Plant Type:</label>
            <input type="text" name="plant_type" value="{{ plant.plant_type }}" required>
        </div>

        <div class="form-group">
            <label>Tools and Materials:</label>
            <textarea name="tools_and_materials" rows="4" required>{{ plant.tools_and_materials }}</textarea>
        </div>

        <div class="form-group">
            <label>Plant Components:</label>
            <textarea name="plants_component" rows="4" required>{{ plant.plants_component }}</textarea>
        </div>

        <div class="form-group">
            <label>Procedure:</label>
            <textarea name="procedure" rows="6" required>{{ plant.procedure }}</textarea>
        </div>

        <div class="form-actions">
            <input type="submit" value="Update Plant" class="btn btn-submit">
            <a href="/home" class="btn btn-reset">Cancel</a>
        </div>
    </form>
</div>
   
</body>
</html>
